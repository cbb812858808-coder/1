name: Build A-share market data
on:
  workflow_dispatch:
  schedule:
    - cron: '30 1 * * 1-5'
permissions:
  contents: write
jobs:
  market:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Build market data
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: python scripts/build_market.py
      - name: Commit market data
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/market.json
          git diff --cached --quiet || git commit -m "Update A-share market data"
          git push
