name: Deploy PWA to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  market:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install market data adapter
        run: pip install -q akshare pandas requests
      - name: Build public market snapshot
        continue-on-error: true
        run: python scripts/build_market_public.py
      - name: Upload market snapshot for Pages
        if: hashFiles('data/market.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: market-snapshot
          path: data/market.json
          retention-days: 1
  deploy:
    needs: market
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Download market snapshot into Pages bundle
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: market-snapshot
          path: data
      - uses: actions/configure-pages@v5
        with: {enablement: true}
      - uses: actions/upload-pages-artifact@v3
        with: {path: .}
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
