name: Deploy PWA to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  market:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install market data adapter
        run: pip install -q akshare pandas requests
      - name: Build public market snapshot
        run: python scripts/build_market_public.py
      - name: Verify market snapshot
        run: python - <<'PY'
          import json
          p='data/market.json'
          d=json.load(open(p,encoding='utf8'))
          n=len(d.get('stocks',[]))
          print('market rows:',n,'source:',d.get('source'))
          assert n >= 1000, 'market snapshot is incomplete'
          PY
      - name: Upload market snapshot
        uses: actions/upload-artifact@v4
        with:
          name: market-snapshot
          path: data/market.json
          retention-days: 1
  deploy:
    needs: market
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Download market snapshot
        uses: actions/download-artifact@v4
        with:
          name: market-snapshot
          path: data
      - name: Verify Pages market file
        run: test -s data/market.json
      - uses: actions/configure-pages@v5
        with: {enablement: true}
      - uses: actions/upload-pages-artifact@v3
        with: {path: .}
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
